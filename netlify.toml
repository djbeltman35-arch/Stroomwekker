[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "https://stroomwekker.netlify.app/*"
  to = "https://stroomwekker.eu/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.stroomwekker.eu/*"
  to = "https://stroomwekker.eu/:splat"
  status = 301
  force = true
