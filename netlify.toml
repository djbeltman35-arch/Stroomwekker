[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://daisycon.tools https://energie.whitelabeled.nl; style-src 'self' 'unsafe-inline' https://daisycon.tools https://energie.whitelabeled.nl; img-src 'self' data: https://energie.whitelabeled.nl https://daisycon.tools; font-src 'self' https://energie.whitelabeled.nl https://daisycon.tools; connect-src 'self' https://api-energie.whitelabeled.nl https://energie.whitelabeled.nl https://daisycon.tools; manifest-src 'self'; worker-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/og.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "https://stroomwekker.netlify.app/*"
  to = "https://stroomwekker.eu/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.stroomwekker.eu/*"
  to = "https://stroomwekker.eu/:splat"
  status = 301
  force = true
